<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbf5ea" />
    <meta name="description" content="沸点火锅点单与门店履约概念演示，非官方产品" />
    <title>沸点 · 火锅点单概念演示</title>
    <script>
      (function () {
        // 在应用渲染前同步语言和主题，避免已保存夜间主题出现浅色闪烁
        try {
          var lang = localStorage.getItem('i18nextLng');
          document.documentElement.lang = (lang === 'en') ? 'en' : 'zh-CN';
          var theme = localStorage.getItem('theme');
          document.documentElement.style.colorScheme = 'light';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#121416');
          }
        } catch (e) {
          // localStorage 不可用时保持默认中文和日间模式
        }
      })();
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
